name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: imresamu/postgis:16-3.4
        env:
          POSTGRES_USER: vidituka
          POSTGRES_PASSWORD: vidituka
          POSTGRES_DB: vidituka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidituka -d vidituka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VIDITUKA_TEST_DATABASE_URL: postgresql+psycopg://vidituka:vidituka@localhost:5432/vidituka_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src tests migrations

      - name: Test
        run: uv run pytest --cov=vidituka --cov-report=term-missing

      - name: Check migrations match the models
        run: uv run alembic check
        env:
          VIDITUKA_DATABASE_URL: ${{ env.VIDITUKA_TEST_DATABASE_URL }}
